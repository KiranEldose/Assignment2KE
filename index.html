<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursework Deadline Assistant</title>
</head>
<body>
    <h1>Courework Deadline Assistant</h1>
    
    <p>
        Review and control suggested personal coursework target dates.
    </p>

    <h2>Coursework details</h2>

    <label for="coursework">
        Coursework name:
    </label>
    <input
      type="text"
      id="coursework"
      value="Intelligent Interactive Systems Report"
    >
    
    <br><br>

    <label for="deadline">
      Official submission deadline:
    </label>
    <input
      type="date"
      id="deadline"
      value="2026-12-18"
    >
    
    <p>
        <strong>Prototype status:</strong>
        AI suggestions will be simulated for demonstration.
    </p>
</body>    
</html>
